<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1210 925" width="1210" height="925" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei','Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Community Smart Grocery as-built architecture</title>
<desc id="d">Three lanes: the simulated IoT packet path, the REST path to the authoritative backend, and the read-only smart service, all backed by PostgreSQL and a local knowledge base.</desc>
<defs>
<marker id="ah-2d6a3e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2d6a3e"/></marker>
<marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
<marker id="ah-243b63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#243b63"/></marker>
<marker id="ah-a63a2b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a63a2b"/></marker>
<marker id="ah-55655a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55655a"/></marker>
</defs>
<rect width="1210" height="925" fill="#ffffff"/>
<text x="30" y="34" font-size="21" font-weight="700" fill="#1f4a2b">社區智慧生鮮超市 · 實際建置架構</text>
<text x="30" y="56" font-size="12.5" fill="#55655a">Community Smart Grocery — as-built architecture · 軟體原型，僅供教學展示 · software prototype, demo only</text>
<rect x="22" y="68" width="336" height="640" rx="12" fill="#fbf5e8" opacity="0.75"/>
<text x="190.0" y="92" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3d4d43">IoT 封包路徑（模擬）</text>
<rect x="372" y="68" width="396" height="640" rx="12" fill="#eef5ef" opacity="0.75"/>
<text x="570.0" y="92" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3d4d43">REST 路徑（權威後端）</text>
<rect x="782" y="68" width="376" height="640" rx="12" fill="#eef1f8" opacity="0.75"/>
<text x="970.0" y="92" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3d4d43">智慧服務（唯讀）</text>
<rect x="40" y="108" width="300" height="92" rx="9" fill="#fff3d6" stroke="#8a5a00" stroke-width="2" stroke-dasharray="7 5"/>
<text x="190.0" y="135" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1c2a21">Python IoT Simulator</text>
<text x="190.0" y="157" text-anchor="middle" font-size="12.2" fill="#3d4d43">backend/app/simulator</text>
<text x="190.0" y="175" text-anchor="middle" font-size="12.2" fill="#3d4d43">產生 16-byte 封包 · 不計算價格</text>
<rect x="40" y="233" width="300" height="92" rx="9" fill="#e3efe5" stroke="#2d6a3e" stroke-width="2"/>
<text x="190.0" y="260" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1c2a21">Packet codec</text>
<text x="190.0" y="282" text-anchor="middle" font-size="12.2" fill="#3d4d43">gateway/packet.py · Header AA55</text>
<text x="190.0" y="300" text-anchor="middle" font-size="12.2" fill="#3d4d43">XOR + 雜湊表檢查碼（教學用）</text>
<rect x="40" y="358" width="300" height="92" rx="9" fill="#fff3d6" stroke="#8a5a00" stroke-width="2" stroke-dasharray="7 5"/>
<text x="190.0" y="385" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1c2a21">MatterTransportAdapter</text>
<text x="190.0" y="407" text-anchor="middle" font-size="12.2" fill="#3d4d43">SimulatedMatterThreadTransport</text>
<text x="190.0" y="425" text-anchor="middle" font-size="12.2" fill="#3d4d43">軟體模擬 · 無真實 Thread / Matter</text>
<rect x="40" y="483" width="300" height="100" rx="9" fill="#e3efe5" stroke="#2d6a3e" stroke-width="2"/>
<text x="190.0" y="510" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1c2a21">Gateway validator + event mapper</text>
<text x="190.0" y="532" text-anchor="middle" font-size="12.2" fill="#3d4d43">長度→Header→指令→檢查碼→裝置→序號→欄位</text>
<text x="190.0" y="550" text-anchor="middle" font-size="12.2" fill="#3d4d43">通過才產生 NormalizedIoTEvent</text>
