<path d="M 1140,154 L 1175,154 L 1175,654 L 1140,654" fill="none" stroke="#243b63" stroke-width="2.2" marker-end="url(#ah-243b63)"/>
<text x="1193" y="400" font-size="11.5" font-weight="600" fill="#243b63" text-anchor="middle" transform="rotate(-90 1193 400)">同一組工具</text>
<rect x="22" y="722" width="1136" height="124" rx="12" fill="#f4f4f1" opacity="0.9"/>
<text x="30" y="741" font-size="13.5" font-weight="700" fill="#3d4d43">資料層 Data</text>
<rect x="40" y="752" width="710" height="84" rx="9" fill="#ffffff" stroke="#55655a" stroke-width="2"/>
<text x="395.0" y="779" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1c2a21">PostgreSQL 16</text>
<text x="395.0" y="801" text-anchor="middle" font-size="12.2" fill="#3d4d43">residents · health_profiles · products · carts · cart_items · orders</text>
<text x="395.0" y="819" text-anchor="middle" font-size="12.2" fill="#3d4d43">order_items · iot_events（稽核）· devices（序號狀態）</text>
<rect x="800" y="752" width="340" height="84" rx="9" fill="#ffffff" stroke="#55655a" stroke-width="2"/>
