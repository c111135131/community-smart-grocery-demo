<text x="348" y="529" font-size="11.5" font-weight="600" fill="#2d6a3e" text-anchor="start">event</text>
<rect x="800" y="108" width="340" height="92" rx="9" fill="#e4ebf7" stroke="#243b63" stroke-width="2"/>
<text x="970.0" y="135" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1c2a21">MCP server（stdio）</text>
<text x="970.0" y="157" text-anchor="middle" font-size="12.2" fill="#3d4d43">app/ai/mcp_server.py · 同一組 3 個唯讀工具</text>
<text x="970.0" y="175" text-anchor="middle" font-size="12.2" fill="#3d4d43">供外部 MCP client 使用 · 無驗證</text>
<rect x="800" y="358" width="340" height="92" rx="9" fill="#e4ebf7" stroke="#243b63" stroke-width="2"/>
<text x="970.0" y="385" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1c2a21">Nutrition agent</text>
<text x="970.0" y="407" text-anchor="middle" font-size="12.2" fill="#3d4d43">脈絡 → 護欄 → 工具 → 推薦 → 措辭</text>
<text x="970.0" y="425" text-anchor="middle" font-size="12.2" fill="#3d4d43">AI 只措辭，不決定價格、庫存、付款</text>
<rect x="800" y="483" width="340" height="100" rx="9" fill="#e4ebf7" stroke="#243b63" stroke-width="2"/>
<text x="970.0" y="510" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1c2a21">Recommender + providers</text>
<text x="970.0" y="532" text-anchor="middle" font-size="12.2" fill="#3d4d43">後端依營養數據決定性排序</text>
<text x="970.0" y="550" text-anchor="middle" font-size="12.2" fill="#3d4d43">Mock（預設）· 選用 Anthropic</text>
<rect x="800" y="608" width="340" height="92" rx="9" fill="#e4ebf7" stroke="#243b63" stroke-width="2"/>
<text x="970.0" y="635" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1c2a21">Read-only ToolBox（MCP 風格）</text>
<text x="970.0" y="657" text-anchor="middle" font-size="12.2" fill="#3d4d43">get_product_info · get_inventory</text>
<text x="970.0" y="675" text-anchor="middle" font-size="12.2" fill="#3d4d43">search_nutrition_knowledge（RAG）</text>
