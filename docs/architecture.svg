<text x="970.0" y="801" text-anchor="middle" font-size="12.2" fill="#3d4d43">knowledge_base/nutrition_seed.json</text>
<text x="970.0" y="819" text-anchor="middle" font-size="12.2" fill="#3d4d43">18 則 · 本地檢索（教學資料）</text>
