<text x="64" y="878" font-size="12.5" fill="#3d4d43">虛線 = 模擬的硬體／傳輸（沒有真實 ESP32、Thread、Matter）</text>
<rect x="470" y="866" width="26" height="14" rx="3" fill="#e3efe5" stroke="#2d6a3e" stroke-width="2"/>
<text x="504" y="878" font-size="12.5" fill="#3d4d43">實線 = 已實作的軟體</text>
<rect x="680" y="866" width="26" height="14" rx="3" fill="#e4ebf7" stroke="#243b63" stroke-width="2"/>
<text x="714" y="878" font-size="12.5" fill="#3d4d43">藍色 = AI 層，對交易資料唯讀</text>
<text x="30" y="906" font-size="12" fill="#55655a">本機以 Docker Compose 啟動：db（PostgreSQL）· backend（FastAPI :8000）· frontend（nginx :5173）。不串接真實金流；檢查碼與登入僅為教學示範，非正式安全機制。</text>
