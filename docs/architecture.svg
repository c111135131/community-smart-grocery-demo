<text x="200" y="473" font-size="11.5" font-weight="600" fill="#2d6a3e" text-anchor="start">16 bytes</text>
<rect x="390" y="108" width="360" height="92" rx="9" fill="#e3efe5" stroke="#2d6a3e" stroke-width="2"/>
<text x="570.0" y="135" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1c2a21">Resident &amp; Admin Web UI</text>
<text x="570.0" y="157" text-anchor="middle" font-size="12.2" fill="#3d4d43">React + TypeScript + Vite</text>
<text x="570.0" y="175" text-anchor="middle" font-size="12.2" fill="#3d4d43">只顯示，不做可信的價格計算</text>
<rect x="390" y="233" width="360" height="92" rx="9" fill="#e3efe5" stroke="#2d6a3e" stroke-width="2"/>
<text x="570.0" y="260" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1c2a21">HTTP REST（JSON）</text>
<text x="570.0" y="282" text-anchor="middle" font-size="12.2" fill="#3d4d43">瀏覽器 ⇄ FastAPI 唯一實作的通訊協定</text>
<text x="570.0" y="300" text-anchor="middle" font-size="12.2" fill="#3d4d43">含逾時、錯誤與重試處理</text>
<rect x="390" y="358" width="360" height="92" rx="9" fill="#e3efe5" stroke="#2d6a3e" stroke-width="2"/>
<text x="570.0" y="385" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1c2a21">FastAPI routers</text>
<text x="570.0" y="407" text-anchor="middle" font-size="12.2" fill="#3d4d43">api/ · residents · products · cart</text>
<text x="570.0" y="425" text-anchor="middle" font-size="12.2" fill="#3d4d43">checkout · nutrition · admin</text>
<rect x="390" y="483" width="360" height="100" rx="9" fill="#e3efe5" stroke="#2d6a3e" stroke-width="2"/>
<text x="570.0" y="510" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1c2a21">權威後端服務 Authoritative services</text>
<text x="570.0" y="532" text-anchor="middle" font-size="12.2" fill="#3d4d43">cart_service · pricing · checkout_service</text>
<text x="570.0" y="550" text-anchor="middle" font-size="12.2" fill="#3d4d43">iot_service（序號與稽核）· order_service</text>
<path d="M 570,200 L 570,233" fill="none" stroke="#2d6a3e" stroke-width="2.2" marker-end="url(#ah-2d6a3e)"/>
<path d="M 570,325 L 570,358" fill="none" stroke="#2d6a3e" stroke-width="2.2" marker-end="url(#ah-2d6a3e)"/>
